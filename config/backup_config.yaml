# ─────────────────────────────────────────────
# Frigate config.yml
# Place this file at ./config/config.yml
# relative to your docker-compose file.
# ─────────────────────────────────────────────
# VERSÃO iGPU — adaptada para rodar em um LXC no Proxmox usando a
# iGPU do i5-8400 (Intel UHD 630) em vez da GTX 1080/TensorRT.
#   - Detecção: detector OpenVINO na GPU (usa a iGPU para inferência)
#   - Decode de vídeo: VAAPI (usa a iGPU para decodificação)
# Sem crop — usa zonas em vez de recorte físico do vídeo.
# ─────────────────────────────────────────────

mqtt:
  enabled: false          # Set to true and fill in host/port if you use Home Assistant / MQTT

detectors:
  ov:
    type: openvino
    device: GPU            # usa a iGPU (UHD 630) via OpenVINO para inferência

model:
  path: /root/frigate/config/model_cache/yolov9-s_openvino.onnx   # modelo precisa estar no formato OpenVINO IR (.xml/.bin), não .onnx
  input_tensor: nhwc
  input_pixel_format: bgr
  input_dtype: float
  width: 320
  height: 320
  model_type: yolo-generic
  labelmap_path: /labelmap/coco-80.txt

# --- go2rtc settings (embutido no próprio container do Frigate)
# SEM crop — só restream direto do stream original (leve, sem decode/encode extra)
go2rtc:
  streams:
    fundos_full:
      - rtsp://admin:BernardI9712@192.168.18.189:554/onvif1
    # fundos_record:
    #   - rtsp://admin:BernardI9712@192.168.18.189:554/onvif2
    #   - ffmpeg:rtsp://localhost:8554/fundos_full#audio=copy
    fundos_detect:
      - rtsp://admin:BernardI9712@192.168.18.189:554/onvif2

# ── Câmera única (imagem original 1920x2160: topo = garagem, base = quintal) ──
cameras:
  Fundos:
    enabled: true
    ffmpeg:
      global_args: -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt
        -use_wallclock_as_timestamps 1
      hwaccel_args: preset-vaapi   # decodificação via iGPU (Intel UHD 630)
      inputs:
        - path: rtsp://localhost:8554/fundos_full
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://localhost:8554/fundos_detect
          input_args: preset-rtsp-restream
          roles:
            - detect
      output_args:
        record: preset-record-generic-audio-aac   # grava com áudio de forma mais estável (evita segmentos corrompidos)

    # ── ONVIF / PTZ ──────────────────────────
    # Testado e confirmado: câmera responde ONVIF na porta 5000
    onvif:
      host: 192.168.18.189
      port: 5000
      user: admin
      password: BernardI9712
      # tls_insecure: False   # descomente se usar https no host acima
      autotracking:
        enabled: false
        track:
          - person
        return_preset: home
        timeout: 10
        zooming: absolute
        zoom_factor: 0.3

    detect:
      enabled: true
      width: 960           # high 960x1080 - mid 640x720 - low 480x540 -stream2 864x976
      height: 1080
      fps: 10

    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 7

    snapshots:
      enabled: true
      retain:
        default: 14

    # ── Zonas — separação lógica, sem custo de CPU extra ──────────
    # Coordenadas normalizadas (0.0 a 1.0), pois a imagem é 1920x2160:
    # topo = garagem (0.0 a 0.5 da altura) | base = quintal (0.5 a 1.0 da altura)
    zones:
      quintal:
        coordinates: 0,0,1,0,1,0.501,0,0.501
        inertia: 3
        loitering_time: 0
        objects:
          - person
          - cat
      rua:
        coordinates: 0,0.501,1,0.501,1,0.551,0.142,0.582,0,0.595
        loitering_time: 0
        inertia: 3
      garagem:
        coordinates: 0,0.595,0.142,0.582,1,0.551,1,1,0,1
        inertia: 3
        loitering_time: 0
        objects:
          - person
          - cat
          - car
    motion:
      threshold: 30
      contour_area: 10
      improve_contrast: true
    objects:
      filters:
        car:
          mask:
            0.132,0.67,0.108,0.675,0.366,1,1,1,1,0.804,0.858,0.665,0.328,0.522,0.148,0.532
        person:
          mask:
            - 0.001,0.763,0.571,0.708,1,0.64,1,0.698,0.571,0.784,0,0.851
            - 0.001,0.908,0.613,0.821,1,0.724,1,0.799,0.618,0.899,0.082,0.964,0.001,0.963
    review:
      alerts:
        required_zones:
          - garagem
          - quintal
        labels:
          - person
          - cat
          - car
          - motorcycle
          - bicycle
      detections:
        labels:
          - person
          - cat
          - car
          - motorcycle
          - bicycle

objects:
  track:
    - person
    - car
    - cat
    - motorcycle
    - bicycle
  filters:
    cat:
      threshold: 0.45
      min_score: 0.30
    motorcycle:
      threshold: 0.55
      min_score: 0.40
    bicycle:
      threshold: 0.50
      min_score: 0.35

# ── Recording storage (retenção global) ───────
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 7
  preview:
    quality: very_high

logger:
  default: info
  logs:
    frigate.record: debug
    ffmpeg.Fundos.detect: debug
    ffmpeg.Fundos.record: debug

# NOTA: a chave "notifications" (notifications.enabled / notifications.email)
# foi removida — não existe no schema oficial do Frigate e pode causar erro
# de validação. Para alertas por e-mail, use Home Assistant + MQTT ou uma
# automação externa que consuma os eventos do Frigate.

version: 0.17-0
semantic_search:
  enabled: false
  model_size: large
face_recognition:
  enabled: false
  model_size: small
lpr:
  enabled: false
classification:
  bird:
    enabled: false
