# ─────────────────────────────────────────────
# Frigate config.yml
# Place this file at ./config/config.yml
# relative to your docker-compose file.
# ─────────────────────────────────────────────
# VERSÃO iGPU — adaptada para rodar em um LXC no Proxmox usando a
# iGPU do i5-8400 (Intel UHD 630) em vez da GTX 1080/TensorRT.
#   - Detecção: detector OpenVINO na GPU (usa a iGPU para inferência)
#   - Decode de vídeo: VAAPI (usa a iGPU para decodificação)
# Sem crop — usa zonas em vez de recorte físico do vídeo.
# ─────────────────────────────────────────────

mqtt:
  enabled: false          # Set to true and fill in host/port if you use Home Assistant / MQTT

detectors:
  ov:
    type: openvino
    device: GPU

# model:
